<div id="menubar">
  <div class="menu-button" data-menu="fileMenu">File ▼</div>
  <div class="menu-button" data-menu="editMenu">Edit ▼</div>
  <div class="menu-button" data-menu="modMenu">Settings ▼</div>

  <!-- FILE MENU -->
  <div id="fileMenu" class="dropdown">
    <div class="item" onclick="newProject()">New Project</div>
    <div class="item" onclick="saveProject()">Save</div>
    <div class="item" onclick="loadProject()">Load</div>
  </div>

  <!-- EDIT MENU -->
  <div id="editMenu" class="dropdown">
    <div class="item" onclick="undo()">Undo</div>
    <div class="item" onclick="redo()">Redo</div>
  </div>

  <!-- SETTINGS MENU -->
  <div id="modMenu" class="dropdown">
    <div class="item" onclick="openModSettings()">Opened Settings</div>
    <div class="item" onclick="toggleChaosMode()">Turbo Mode</div>
    <div class="item" onclick="aboutMod()">About This Mod</div>
    <div class="item" onclick="addons()">Addons</div>
  </div>
</div>
